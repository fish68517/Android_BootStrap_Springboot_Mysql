<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #ade790;
        }
        .login-form {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            margin: auto;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="login-form text-center">
    <main class="form-signin">
        <h1 class="h2 mb-3 fw-bold">外卖点餐系统</h1>
        <h2 class="h4 mb-4 fw-normal">请登录</h2>
        <div id="error-message" class="alert alert-danger" style="display: none;"></div>
        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="nickname" placeholder="Nickname">
            <label for="nickname">用户名</label>
        </div>
        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="password" placeholder="Password">
            <label for="password">密码</label>
        </div>

        <button class="w-100 btn btn-lg btn-primary" type="button" onclick="login()">登录</button>
        <p class="mt-3">
            没有账户? <a href="/register">立即注册</a>
        </p>
        <p class="mt-5 mb-3 text-muted">&copy; 2024</p>
    </main>
</div>

<script>
    function login() {
        const nickname = document.getElementById('nickname').value;
        const password = document.getElementById('password').value;
        const errorMessage = document.getElementById('error-message');

        fetch('/api/users/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: `nickname=${encodeURIComponent(nickname)}&password=${encodeURIComponent(password)}`
        })
        .then(response => {
            if (response.ok) {
                return response.json();
            } else {
                throw new Error('登录失败');
            }
        })
        .then(data => {
            if (data && data.userId) {
                // 登录成功, 跳转到主页
                window.location.href = '/admin/index';
            } else {
                 errorMessage.textContent = '用户名或密码错误';
                 errorMessage.style.display = 'block';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            errorMessage.textContent = '登录时发生错误，请稍后重试。';
            errorMessage.style.display = 'block';
        });
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

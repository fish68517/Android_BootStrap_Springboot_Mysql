<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料 - 游戏推荐平台</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .profile-container {
            max-width: 800px;
            margin: 50px auto;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
        .user-info-item {
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
        }
        .user-info-item:last-child {
            border-bottom: none;
        }
        .badge-role {
            font-size: 0.9rem;
            padding: 5px 15px;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-controller"></i> 游戏推荐平台
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/user/profile}">个人资料</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/user/logout}">退出登录</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container profile-container">
        <!-- 成功消息 -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- 错误消息 -->
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row">
            <!-- 用户信息卡片 -->
            <div class="col-md-5 mb-4">
                <div class="card">
                    <div class="card-header text-center">
                        <h4 class="mb-0">
                            <i class="bi bi-person-circle"></i> 用户信息
                        </h4>
                    </div>
                    <div class="card-body p-0">
                        <div class="user-info-item">
                            <div class="text-muted small">用户ID</div>
                            <div class="fw-bold" th:text="${user.userId}"></div>
                        </div>
                        <div class="user-info-item">
                            <div class="text-muted small">用户名</div>
                            <div class="fw-bold" th:text="${user.username}"></div>
                        </div>
                        <div class="user-info-item">
                            <div class="text-muted small">昵称</div>
                            <div class="fw-bold" th:text="${user.nickname}"></div>
                        </div>
                        <div class="user-info-item">
                            <div class="text-muted small">角色</div>
                            <div>
                                <span class="badge badge-role" 
                                      th:classappend="${user.role == 'admin'} ? 'bg-danger' : (${user.role == 'publisher'} ? 'bg-warning text-dark' : 'bg-primary')"
                                      th:text="${user.role == 'admin'} ? '管理员' : (${user.role == 'publisher'} ? '发布者' : '普通用户')">
                                </span>
                            </div>
                        </div>
                        <div class="user-info-item">
                            <div class="text-muted small">注册时间</div>
                            <div class="fw-bold" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 修改资料表单 -->
            <div class="col-md-7">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0">
                            <i class="bi bi-pencil-square"></i> 修改资料
                        </h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/user/profile/update}" method="post">
                            <div class="mb-3">
                                <label for="nickname" class="form-label">昵称</label>
                                <input type="text" 
                                       class="form-control" 
                                       id="nickname" 
                                       name="nickname"
                                       th:value="${user.nickname}"
                                       placeholder="请输入新昵称">
                                <div class="form-text">修改您的显示昵称</div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">新密码</label>
                                <input type="password" 
                                       class="form-control" 
                                       id="password" 
                                       name="password"
                                       placeholder="如需修改密码请输入新密码">
                                <div class="form-text">留空则不修改密码</div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> 保存修改
                                </button>
                            </div>
                        </form>

                        <hr class="my-4">

                        <!-- 删除账号 -->
                        <div class="text-center">
                            <h6 class="text-danger mb-3">危险操作</h6>
                            <button type="button" class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#deleteModal">
                                <i class="bi bi-trash"></i> 删除账号
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 删除确认模态框 -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">
                        <i class="bi bi-exclamation-triangle-fill"></i> 确认删除账号
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0">您确定要删除账号吗？此操作不可恢复，将删除您的所有数据！</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <form th:action="@{/user/delete}" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-danger">确认删除</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

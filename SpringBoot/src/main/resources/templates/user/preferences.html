<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>偏好设置 - 游戏推荐平台</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .preferences-container {
            max-width: 900px;
            margin: 50px auto;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
        .preference-item {
            margin-bottom: 15px;
        }
        .preference-checkbox {
            display: none;
        }
        .preference-label {
            display: block;
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-weight: 500;
        }
        .preference-label:hover {
            border-color: #667eea;
            background-color: #f8f9ff;
        }
        .preference-checkbox:checked + .preference-label {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .preference-icon {
            font-size: 2rem;
            display: block;
            margin-bottom: 10px;
        }
        .first-time-banner {
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-controller"></i> 游戏推荐平台
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/user/profile}">个人资料</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/user/preferences}">偏好设置</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/user/logout}">退出登录</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container preferences-container">
        <!-- 首次登录提示 -->
        <div th:if="${showPreferencePrompt}" class="first-time-banner">
            <h4 class="mb-2">
                <i class="bi bi-star-fill"></i> 欢迎来到游戏推荐平台！
            </h4>
            <p class="mb-0">请选择您喜欢的游戏类型，我们将为您推荐更合适的游戏</p>
        </div>

        <!-- 成功消息 -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- 错误消息 -->
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card">
            <div class="card-header text-center">
                <h4 class="mb-0">
                    <i class="bi bi-heart-fill"></i> 游戏偏好设置
                </h4>
                <p class="mb-0 mt-2 small">选择您喜欢的游戏类型（可多选）</p>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/user/preferences/save}" method="post">
                    <div class="row">
                        <div class="col-md-4" th:each="preference : ${allPreferences}">
                            <div class="preference-item">
                                <input type="checkbox" 
                                       class="preference-checkbox" 
                                       th:id="'pref-' + ${preference.preferenceId}"
                                       name="preferenceIds" 
                                       th:value="${preference.preferenceId}"
                                       th:checked="${userPreferenceIds.contains(preference.preferenceId)}">
                                <label class="preference-label" th:for="'pref-' + ${preference.preferenceId}">
                                    <span class="preference-icon">
                                        <i class="bi" 
                                           th:classappend="${preference.preferenceName == 'RPG'} ? 'bi-person-badge' : 
                                                          (${preference.preferenceName == '策略'} ? 'bi-diagram-3' : 
                                                          (${preference.preferenceName == '射击'} ? 'bi-crosshair' : 
                                                          (${preference.preferenceName == '模拟'} ? 'bi-gear' : 
                                                          (${preference.preferenceName == '休闲'} ? 'bi-emoji-smile' : 'bi-joystick'))))">
                                        </i>
                                    </span>
                                    <span th:text="${preference.preferenceName}"></span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <hr class="my-4">

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-save"></i> 保存偏好设置
                        </button>
                        <a th:href="@{/}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> 返回首页
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <div class="text-center mt-4 text-muted">
            <small>
                <i class="bi bi-info-circle"></i> 
                您可以随时在此页面修改您的游戏偏好设置
            </small>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏 - 游戏推荐平台</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 0;
            margin-bottom: 30px;
        }
        .game-card {
            transition: transform 0.3s, box-shadow 0.3s;
            height: 100%;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }
        .game-card img {
            height: 200px;
            object-fit: cover;
        }
        .unfavorite-btn {
            transition: all 0.3s;
        }
        .unfavorite-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="bi bi-controller"></i> 游戏推荐平台
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/game/list}">游戏列表</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/favorite/list}">我的收藏</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/game/my-games}">我的游戏</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/user/profile}">个人中心</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/user/logout}">退出</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 页面标题 -->
    <div class="page-header">
        <div class="container">
            <h1 class="text-center">
                <i class="bi bi-heart-fill"></i> 我的收藏
            </h1>
            <p class="text-center mb-0">共收藏 <span th:text="${#lists.size(favorites)}">0</span> 个游戏</p>
        </div>
    </div>

    <!-- 收藏列表 -->
    <div class="container my-5">
        <!-- 游戏卡片 -->
        <div class="row row-cols-1 row-cols-md-3 g-4" th:if="${favorites != null and !favorites.isEmpty()}">
            <div class="col" th:each="game : ${favorites}">
                <div class="card game-card">
                    <img th:src="${game.coverImageUrl != null and !game.coverImageUrl.isEmpty() ? game.coverImageUrl : 'https://via.placeholder.com/400x200?text=No+Image'}" 
                         class="card-img-top" 
                         th:alt="${game.title}">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${game.title}">游戏标题</h5>
                        <p class="card-text text-muted" 
                           th:text="${#strings.length(game.description) > 100 ? #strings.substring(game.description, 0, 100) + '...' : game.description}">
                            游戏描述
                        </p>
                        <div class="d-flex justify-content-between align-items-center">
                            <a th:href="@{/game/detail/{id}(id=${game.gameId})}" class="btn btn-primary btn-sm">
                                <i class="bi bi-eye"></i> 查看详情
                            </a>
                            <button type="button" 
                                    class="btn btn-sm btn-outline-danger unfavorite-btn"
                                    th:data-game-id="${game.gameId}"
                                    onclick="unfavoriteGame(this)">
                                <i class="bi bi-heart-fill"></i> 取消收藏
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 空状态 -->
        <div th:if="${favorites == null or favorites.isEmpty()}" class="text-center py-5">
            <i class="bi bi-heart" style="font-size: 4rem; color: #ccc;"></i>
            <h4 class="mt-3 text-muted">暂无收藏</h4>
            <p class="text-muted">快去 <a th:href="@{/game/list}">游戏列表</a> 收藏你喜欢的游戏吧！</p>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 取消收藏功能
        function unfavoriteGame(btn) {
            const gameId = $(btn).data('game-id');
            
            if (!confirm('确定要取消收藏这个游戏吗？')) {
                return;
            }
            
            $.ajax({
                url: '/favorite/remove',
                type: 'POST',
                data: { gameId: gameId },
                success: function(response) {
                    if (response.success) {
                        // 移除卡片
                        $(btn).closest('.col').fadeOut(300, function() {
                            $(this).remove();
                            // 更新收藏数量
                            const count = $('.game-card').length;
                            $('.page-header span').text(count);
                            
                            // 如果没有收藏了，显示空状态
                            if (count === 0) {
                                location.reload();
                            }
                        });
                    } else {
                        alert(response.message || '取消收藏失败');
                    }
                },
                error: function() {
                    alert('操作失败，请稍后重试');
                }
            });
        }
    </script>
</body>
</html>

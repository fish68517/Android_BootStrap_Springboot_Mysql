<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员资料 - 游戏推荐平台</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .profile-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
    </style>
</head>
<body>
<div class="profile-container">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <div>
                <h3 class="mb-0">管理员资料</h3>
                <p class="mb-0 mt-2">管理您的个人信息</p>
            </div>
            <a th:href="@{/admin/dashboard}" class="btn btn-light btn-sm">返回管理面板</a>
        </div>
        <div class="card-body p-4">
            <!-- 成功消息 -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- 错误消息 -->
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- 管理员信息展示 -->
            <div class="row mb-4">
                <div class="col-md-3 text-center">
                    <div class="bg-secondary rounded-circle d-flex align-items-center justify-content-center mx-auto"
                         style="width: 120px; height: 120px;">
                        <span class="text-white" style="font-size: 3rem;">👤</span>
                    </div>
                </div>
                <div class="col-md-9">
                    <h4 th:text="${user.nickname ?: user.username}">管理员名称</h4>
                    <p class="text-muted">
                        <strong>用户名：</strong><span th:text="${user.username}">username</span>
                    </p>
                    <p class="text-muted">
                        <strong>角色：</strong><span th:text="${user.role}">admin</span>
                    </p>
                    <div class="user-info-item">
                        <div class="text-muted small">注册时间</div>
                        <div class="fw-bold" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></div>
                    </div>
                </div>
            </div>

            <!-- 资料编辑表单 -->
            <div class="border-top pt-4">
                <h5>编辑资料</h5>
                <form th:action="@{/user/profile/update}" method="post">
                    <div class="mb-3">
                        <label for="nickname" class="form-label">昵称</label>
                        <input type="text"
                               class="form-control"
                               id="nickname"
                               name="nickname"
                               th:value="${user.nickname}"
                               placeholder="请输入昵称">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">新密码</label>
                        <input type="password"
                               class="form-control"
                               id="password"
                               name="password"
                               placeholder="留空则不修改密码">
                        <div class="form-text">如需修改密码，请输入新密码（6-20个字符）</div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button type="submit" class="btn btn-primary">更新资料</button>
                    </div>
                </form>
            </div>

            <!-- 删除账号警告 -->
            <div class="border-top pt-4 mt-4">
                <h5 class="text-danger">危险操作</h5>
                <div class="alert alert-warning">
                    <strong>警告：</strong>删除账号是不可逆的操作，请谨慎操作。
                </div>
                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#deleteModal">
                        删除账号
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 删除确认模态框 -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteModalLabel">确认删除账号</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>您确定要删除此账号吗？此操作不可恢复。</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <form th:action="@{/user/delete}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger">确认删除</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>点赞管理 - 游戏推荐平台管理后台</title>

    <!-- Custom fonts for this template-->
    <link th:href="@{/admin_theme/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">

    <!-- Custom styles for this template-->
    <link th:href="@{/admin_theme/css/sb-admin-2.min.css}" rel="stylesheet">

    <!-- Custom styles for this page -->
    <link th:href="@{/admin_theme/vendor/datatables/dataTables.bootstrap4.min.css}" rel="stylesheet">
</head>

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- Sidebar -->
        <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">

            <!-- Sidebar - Brand -->
            <a class="sidebar-brand d-flex align-items-center justify-content-center" th:href="@{/admin/dashboard}">
                <div class="sidebar-brand-icon rotate-n-15">
                    <i class="fas fa-gamepad"></i>
                </div>
                <div class="sidebar-brand-text mx-3">游戏推荐平台</div>
            </a>

            <!-- Divider -->
            <hr class="sidebar-divider my-0">

            <!-- Nav Item - Dashboard -->
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin/dashboard}">
                    <i class="fas fa-fw fa-tachometer-alt"></i>
                    <span>控制台</span></a>
            </li>

            <!-- Divider -->
            <hr class="sidebar-divider">

            <!-- Heading -->
            <div class="sidebar-heading">
                审核管理
            </div>

            <!-- Nav Item - 游戏审核 -->
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin/games/pending}">
                    <i class="fas fa-fw fa-gamepad"></i>
                    <span>游戏审核</span></a>
            </li>

            <!-- Nav Item - 评论审核 -->
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin/comments/pending}">
                    <i class="fas fa-fw fa-comments"></i>
                    <span>评论审核</span></a>
            </li>

            <!-- Nav Item - 撤回审核 -->
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin/withdrawals/pending}">
                    <i class="fas fa-fw fa-undo"></i>
                    <span>撤回审核</span></a>
            </li>

            <!-- Divider -->
            <hr class="sidebar-divider">

            <!-- Heading -->
            <div class="sidebar-heading">
                系统管理
            </div>

            <!-- Nav Item - 用户管理 -->
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin/users}">
                    <i class="fas fa-fw fa-users"></i>
                    <span>用户管理</span></a>
            </li>

            <!-- Nav Item - 推荐管理 -->
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin/recommendations}">
                    <i class="fas fa-fw fa-star"></i>
                    <span>推荐管理</span></a>
            </li>

            <!-- Nav Item - 收藏管理 -->
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin/manage-favorites}">
                    <i class="fas fa-fw fa-heart"></i>
                    <span>收藏管理</span></a>
            </li>

            <!-- Nav Item - 点赞管理 -->
            <li class="nav-item active">
                <a class="nav-link" th:href="@{/admin/manage-likes}">
                    <i class="fas fa-fw fa-thumbs-up"></i>
                    <span>点赞管理</span></a>
            </li>

            <!-- Divider -->
            <hr class="sidebar-divider d-none d-md-block">

            <!-- Sidebar Toggler (Sidebar) -->
            <div class="text-center d-none d-md-inline">
                <button class="rounded-circle border-0" id="sidebarToggle"></button>
            </div>

        </ul>
        <!-- End of Sidebar -->

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- Topbar -->
                <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">

                    <!-- Sidebar Toggle (Topbar) -->
                    <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
                        <i class="fa fa-bars"></i>
                    </button>

                    <!-- Topbar Navbar -->
                    <ul class="navbar-nav ml-auto">

                        <!-- Nav Item - User Information -->
                        <li class="nav-item dropdown no-arrow">
                            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                                data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                <span class="mr-2 d-none d-lg-inline text-gray-600 small">管理员</span>
                                <i class="fas fa-user-circle fa-2x"></i>
                            </a>
                            <!-- Dropdown - User Information -->
                            <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in"
                                aria-labelledby="userDropdown">
                                <a class="dropdown-item" th:href="@{/user/logout}">
                                    <i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i>
                                    退出登录
                                </a>
                            </div>
                        </li>

                    </ul>

                </nav>
                <!-- End of Topbar -->

                <!-- Begin Page Content -->
                <div class="container-fluid">

                    <!-- Page Heading -->
                    <h1 class="h3 mb-2 text-gray-800">点赞管理</h1>
                    <p class="mb-4">查看和管理所有用户的评论点赞记录</p>

                    <!-- DataTales Example -->
                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">所有点赞记录</h6>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                                    <thead>
                                        <tr>
                                            <th>用户</th>
                                            <th>评论内容</th>
                                            <th>所属游戏</th>
                                            <th>点赞时间</th>
                                            <th>操作</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="like : ${likes}">
                                            <td>
                                                <span th:if="${userMap.containsKey(like.userId)}"
                                                      th:text="${userMap.get(like.userId).username}"></span>
                                                <span th:unless="${userMap.containsKey(like.userId)}"
                                                      class="text-muted">用户已删除</span>
                                            </td>
                                            <td>
                                                <span th:if="${commentMap.containsKey(like.commentId)}">
                                                    <span th:text="${#strings.abbreviate(commentMap.get(like.commentId).content, 50)}"></span>
                                                </span>
                                                <span th:unless="${commentMap.containsKey(like.commentId)}"
                                                      class="text-muted">评论已删除</span>
                                            </td>
                                            <td>
                                                <span th:if="${commentMap.containsKey(like.commentId) and gameMap.containsKey(commentMap.get(like.commentId).gameId)}"
                                                      th:text="${gameMap.get(commentMap.get(like.commentId).gameId).title}"></span>
                                                <span th:unless="${commentMap.containsKey(like.commentId) and gameMap.containsKey(commentMap.get(like.commentId).gameId)}"
                                                      class="text-muted">游戏已删除</span>
                                            </td>
                                            <td th:text="${#temporals.format(like.likedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                                            <td>
                                                <button class="btn btn-danger btn-sm"
                                                        th:onclick="'deleteLike(' + ${like.userId} + ', ' + ${like.commentId} + ')'">
                                                    <i class="fas fa-trash"></i> 删除
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                </div>
                <!-- /.container-fluid -->

            </div>
            <!-- End of Main Content -->

            <!-- Footer -->
            <footer class="sticky-footer bg-white">
                <div class="container my-auto">
                    <div class="copyright text-center my-auto">
                        <span>Copyright &copy; 游戏推荐平台 2025</span>
                    </div>
                </div>
            </footer>
            <!-- End of Footer -->

        </div>
        <!-- End of Content Wrapper -->

    </div>
    <!-- End of Page Wrapper -->

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fas fa-angle-up"></i>
    </a>

    <!-- Bootstrap core JavaScript-->
    <script th:src="@{/admin_theme/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/admin_theme/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

    <!-- Core plugin JavaScript-->
    <script th:src="@{/admin_theme/vendor/jquery-easing/jquery.easing.min.js}"></script>

    <!-- Custom scripts for all pages-->
    <script th:src="@{/admin_theme/js/sb-admin-2.min.js}"></script>

    <!-- Page level plugins -->
    <script th:src="@{/admin_theme/vendor/datatables/jquery.dataTables.min.js}"></script>
    <script th:src="@{/admin_theme/vendor/datatables/dataTables.bootstrap4.min.js}"></script>

    <!-- Page level custom scripts -->
    <script>
        $(document).ready(function() {
            $('#dataTable').DataTable({
                "language": {
                    "url": "//cdn.datatables.net/plug-ins/1.10.24/i18n/Chinese.json"
                },
                "order": [[ 3, "desc" ]]
            });
        });

        function deleteLike(userId, commentId) {
            if (!confirm('确定要删除这条点赞记录吗？')) {
                return;
            }

            $.ajax({
                url: '/admin/likes/delete',
                type: 'POST',
                data: {
                    userId: userId,
                    commentId: commentId
                },
                success: function(response) {
                    if (response.success) {
                        alert(response.message);
                        location.reload();
                    } else {
                        alert(response.message);
                    }
                },
                error: function() {
                    alert('操作失败，请稍后重试');
                }
            });
        }
    </script>

</body>

</html>

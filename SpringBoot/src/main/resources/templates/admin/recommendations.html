<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/_layout}">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>管理员 - 推荐管理</title>
    <link th:href="@{/admin_theme/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link th:href="@{/admin_theme/css/sb-admin-2.min.css}" rel="stylesheet">
</head>

<body layout:fragment="content">
<div id="wrapper">

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">

            <div class="container-fluid">

                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800">推荐管理</h1>
                    <button class="btn btn-primary" data-toggle="modal" data-target="#createRecommendationModal">
                        <i class="fas fa-plus fa-sm"></i> 创建新推荐
                    </button>
                </div>

                <!-- 成功/错误消息 -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${success}"></span>
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}"></span>
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <!-- 推荐列表 -->
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">所有推荐</h6>
                    </div>
                    <div class="card-body">
                        <div th:if="${recommendations.isEmpty()}" class="text-center py-4">
                            <p class="text-muted">暂无推荐记录</p>
                        </div>
                        <div th:if="${!recommendations.isEmpty()}" class="table-responsive">
                            <table class="table table-bordered" width="100%" cellspacing="0">
                                <thead>
                                    <tr>
                                        <th>推荐ID</th>
                                        <th>用户</th>
                                        <th>游戏</th>
                                        <th>推荐理由</th>
                                        <th>创建时间</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="rec : ${recommendations}">
                                        <td th:text="${rec.recommendationId}">1</td>
                                        <td>
                                            <span th:if="${userMap.containsKey(rec.userId)}"
                                                  th:text="${userMap.get(rec.userId).nickname != null ? userMap.get(rec.userId).nickname : userMap.get(rec.userId).username}">
                                                用户名
                                            </span>
                                            <span th:unless="${userMap.containsKey(rec.userId)}" class="text-muted">
                                                未知用户
                                            </span>
                                        </td>
                                        <td>
                                            <span th:if="${gameMap.containsKey(rec.gameId)}"
                                                  th:text="${gameMap.get(rec.gameId).title}">
                                                游戏名称
                                            </span>
                                            <span th:unless="${gameMap.containsKey(rec.gameId)}" class="text-muted">
                                                未知游戏
                                            </span>
                                        </td>
                                        <td th:text="${rec.reason}">推荐理由</td>
                                        <td th:text="${#temporals.format(rec.createdAt, 'yyyy-MM-dd HH:mm')}">2025-01-01 12:00</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto">
                    <span>Copyright &copy; Your Website 2025</span>
                </div>
            </div>
        </footer>
    </div>
</div>

<!-- 创建推荐模态框 -->
<div class="modal fade" id="createRecommendationModal" tabindex="-1" role="dialog" aria-labelledby="createRecommendationModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="createRecommendationModalLabel">创建新推荐</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <form th:action="@{/admin/recommendations/create}" method="post">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="userId">选择用户</label>
                        <select class="form-control" id="userId" name="userId" required>
                            <option value="">-- 请选择用户 --</option>
                            <option th:each="user : ${users}"
                                    th:value="${user.userId}"
                                    th:text="${user.nickname != null ? user.nickname + ' (' + user.username + ')' : user.username}">
                                用户名
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="gameId">选择游戏</label>
                        <select class="form-control" id="gameId" name="gameId" required>
                            <option value="">-- 请选择游戏 --</option>
                            <option th:each="game : ${approvedGames}"
                                    th:value="${game.gameId}"
                                    th:text="${game.title}">
                                游戏名称
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="reason">推荐理由</label>
                        <textarea class="form-control" id="reason" name="reason" rows="3"
                                  placeholder="请输入推荐理由..." required></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">创建推荐</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/admin_theme/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/admin_theme/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/admin_theme/vendor/jquery-easing/jquery.easing.min.js}"></script>
<script th:src="@{/admin_theme/js/sb-admin-2.min.js}"></script>
</body>
</html>

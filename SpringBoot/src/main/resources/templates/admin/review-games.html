<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>游戏审核 - 管理员后台</title>
    <link th:href="@{/admin_theme/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link th:href="@{/admin_theme/css/sb-admin-2.min.css}" rel="stylesheet">
</head>

<body id="page-top">
<div id="wrapper">
    <!-- Sidebar -->
    <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
        <a class="sidebar-brand d-flex align-items-center justify-content-center" th:href="@{/admin/dashboard}">
            <div class="sidebar-brand-icon rotate-n-15"><i class="fas fa-laugh-wink"></i></div>
            <div class="sidebar-brand-text mx-3">管理员后台</div>
        </a>
        <hr class="sidebar-divider my-0">
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/dashboard}"><i class="fas fa-fw fa-tachometer-alt"></i><span>主页</span></a>
        </li>
        <hr class="sidebar-divider">
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/leaderboard}"><i class="fas fa-fw fa-list-ol"></i><span>排行榜</span></a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/recommendations}"><i class="fas fa-fw fa-star"></i><span>推荐管理</span></a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/manage-favorites}"><i class="fas fa-fw fa-heart"></i><span>收藏管理</span></a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/manage-likes}"><i class="fas fa-fw fa-thumbs-up"></i><span>点赞管理</span></a>
        </li>
        <hr class="sidebar-divider">
        <div class="sidebar-heading">审核管理</div>
        <li class="nav-item active">
            <a class="nav-link" th:href="@{/admin/games/pending}"><i class="fas fa-fw fa-gamepad"></i><span>游戏审核</span></a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/comments/pending}"><i class="fas fa-fw fa-comments"></i><span>评论审核</span></a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/withdrawals/pending}"><i class="fas fa-fw fa-undo"></i><span>撤回审核</span></a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/users}"><i class="fas fa-fw fa-users"></i><span>用户管理</span></a>
        </li>
        <hr class="sidebar-divider">
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/profile}"><i class="fas fa-fw fa-user"></i><span>个人中心</span></a>
        </li>
    </ul>
    <!-- End of Sidebar -->

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <!-- Topbar -->
            <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item dropdown no-arrow">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                           data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            <span class="mr-2 d-none d-lg-inline text-gray-600 small">管理员</span>
                            <img class="img-profile rounded-circle" th:src="@{/img/undraw_profile.png}">
                        </a>
                    </li>
                </ul>
            </nav>
            <!-- End of Topbar -->

            <!-- Begin Page Content -->
            <div class="container-fluid">
                <h1 class="h3 mb-4 text-gray-800">待审核游戏</h1>

                <!-- Success/Error Messages -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${success}"></span>
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}"></span>
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <!-- Pending Games Table -->
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">待审核游戏列表</h6>
                    </div>
                    <div class="card-body">
                        <div th:if="${pendingGames.isEmpty()}" class="text-center py-4">
                            <p class="text-muted">暂无待审核的游戏</p>
                        </div>
                        <div th:if="${!pendingGames.isEmpty()}" class="table-responsive">
                            <table class="table table-bordered" width="100%" cellspacing="0">
                                <thead>
                                    <tr>
                                        <th>游戏ID</th>
                                        <th>封面</th>
                                        <th>标题</th>
                                        <th>描述</th>
                                        <th>发布者</th>
                                        <th>提交时间</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="game : ${pendingGames}">
                                        <td th:text="${game.gameId}">1</td>
                                        <td>
                                            <img th:src="${game.coverImageUrl != null ? game.coverImageUrl : 'https://via.placeholder.com/100x60?text=No+Image'}"
                                                 style="width: 100px; height: 60px; object-fit: cover;" alt="封面">
                                        </td>
                                        <td th:text="${game.title}">游戏标题</td>
                                        <td>
                                            <span th:text="${#strings.length(game.description) > 50 ? #strings.substring(game.description, 0, 50) + '...' : game.description}">
                                                游戏描述
                                            </span>
                                        </td>
                                        <td th:text="${publisherMap.get(game.publisherId)?.nickname ?: '未知'}">发布者</td>
                                        <td th:text="${#temporals.format(game.submittedAt, 'yyyy-MM-dd HH:mm')}">2025-01-01 12:00</td>
                                        <td>
                                            <a th:href="@{/admin/game/{id}(id=${game.gameId})}" class="btn btn-info btn-sm mb-1">
                                                <i class="fas fa-eye"></i> 查看详情
                                            </a>
                                            <form th:action="@{/admin/games/review}" method="post" style="display: inline;">
                                                <input type="hidden" name="gameId" th:value="${game.gameId}">
                                                <input type="hidden" name="status" value="approved">
                                                <button type="submit" class="btn btn-success btn-sm mb-1">
                                                    <i class="fas fa-check"></i> 通过
                                                </button>
                                            </form>
                                            <form th:action="@{/admin/games/review}" method="post" style="display: inline;">
                                                <input type="hidden" name="gameId" th:value="${game.gameId}">
                                                <input type="hidden" name="status" value="rejected">
                                                <button type="submit" class="btn btn-danger btn-sm mb-1" 
                                                        onclick="return confirm('确定要拒绝这个游戏吗？');">
                                                    <i class="fas fa-times"></i> 拒绝
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
            <!-- /.container-fluid -->
        </div>
        <!-- End of Main Content -->

        <!-- Footer -->
        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto">
                    <span>Copyright &copy; Your Website 2025</span>
                </div>
            </div>
        </footer>
        <!-- End of Footer -->
    </div>
    <!-- End of Content Wrapper -->
</div>
<!-- End of Page Wrapper -->

<script th:src="@{/admin_theme/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/admin_theme/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/admin_theme/vendor/jquery-easing/jquery.easing.min.js}"></script>
<script th:src="@{/admin_theme/js/sb-admin-2.min.js}"></script>
</body>
</html>

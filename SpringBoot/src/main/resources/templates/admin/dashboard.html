<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>管理员 - 主页</title>
    <link th:href="@{/admin_theme/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link th:href="@{/admin_theme/css/sb-admin-2.min.css}" rel="stylesheet">
</head>

<body id="page-top">
<div id="wrapper">
    <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
        <a class="sidebar-brand d-flex align-items-center justify-content-center" th:href="@{/admin/dashboard}">
            <div class="sidebar-brand-icon rotate-n-15"><i class="fas fa-laugh-wink"></i></div>
            <div class="sidebar-brand-text mx-3">管理员后台</div>
        </a>
        <hr class="sidebar-divider my-0">
        <li class="nav-item active">
            <a class="nav-link" th:href="@{/admin/dashboard}"><i class="fas fa-fw fa-tachometer-alt"></i><span>主页</span></a>
        </li>
        <hr class="sidebar-divider">
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/leaderboard}"><i class="fas fa-fw fa-list-ol"></i><span>排行榜</span></a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/favorites}"><i class="fas fa-fw fa-heart"></i><span>收藏</span></a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/likes}"><i class="fas fa-fw fa-thumbs-up"></i><span>点赞</span></a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/recommendations}"><i class="fas fa-fw fa-star"></i><span>推荐管理</span></a>
        </li>
        <hr class="sidebar-divider">
        <div class="sidebar-heading">审核管理</div>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/games/pending}"><i class="fas fa-fw fa-gamepad"></i><span>游戏审核</span></a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/comments/pending}"><i class="fas fa-fw fa-comments"></i><span>评论审核</span></a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/withdrawals/pending}"><i class="fas fa-fw fa-undo"></i><span>撤回审核</span></a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/users}"><i class="fas fa-fw fa-users"></i><span>用户管理</span></a>
        </li>
        <hr class="sidebar-divider">
        <li class="nav-item" hidden="hidden">
            <a class="nav-link" th:href="@{/admin/profile}"><i class="fas fa-fw fa-user"></i><span>个人中心</span></a>
        </li>
    </ul>
    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item dropdown no-arrow">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                           data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            <span class="mr-2 d-none d-lg-inline text-gray-600 small">管理员</span>
                            <img class="img-profile rounded-circle" th:src="@{/admin_theme/img/undraw_profile.svg}">
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="container-fluid">

                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800">主页</h1>
                    <form th:action="@{/admin/dashboard}" method="get"
                          class="d-none d-sm-inline-block form-inline ml-auto my-2 my-md-0 mw-100 navbar-search">
                        <div class="input-group">
                            <input type="text" name="query" class="form-control bg-light border-0 small"
                                   placeholder="搜索游戏..." th:value="${query}">
                            <div class="input-group-append">
                                <button class="btn btn-primary" type="submit">
                                    <i class="fas fa-search fa-sm"></i>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>

                <div th:if="${!isSearchResult}">
                    <h5 class="mb-3">游戏 Banner</h5>
                    <div id="gameBanner" class="carousel slide mb-4" data-ride="carousel">
                        <div class="carousel-inner" style="max-height: 400px; background-color: #333;">

                            <div th:each="game, iter : ${games}"
                                 class="carousel-item"
                                 th:classappend="${iter.index == 0 ? 'active' : ''}">

                                <a th:href="@{/admin/game/{id}(id=${game.gameId})}">
                                    <img th:src="${game.coverImageUrl != null ? game.coverImageUrl : 'https://via.placeholder.com/800x400?text=No+Image'}"
                                         class="d-block w-100" style="object-fit: cover; height: 400px; opacity: 0.8;"
                                         alt="...">
                                    <div class="carousel-caption d-none d-md-block">
                                        <h5 th:text="${game.title}">游戏标题</h5>
                                        <p th:text="${game.description}">游戏描述</p>
                                    </div>
                                </a>
                            </div>
                        </div>
                        <a class="carousel-control-prev" href="#gameBanner" role="button" data-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        </a>
                        <a class="carousel-control-next" href="#gameBanner" role="button" data-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        </a>
                    </div>
                </div>

                <div th:if="${isSearchResult}">
                    <h5 class="mb-3" th:text="'搜索结果: ' + ${query}">搜索结果</h5>
                    <div class="row">
                        <div th:if="${games.isEmpty()}" class="col-12">
                            <p>未找到相关游戏。</p>
                        </div>
                        <div th:each="game : ${games}" class="col-xl-4 col-md-6 mb-4">

                            <a th:href="@{/admin/game/{id}(id=${game.gameId})}" class="text-decoration-none text-dark">
                                <div class="card shadow h-100">
                                    <img th:src="${game.coverImageUrl != null ? game.coverImageUrl : 'https://via.placeholder.com/400x250?text=No+Image'}"
                                         class="card-img-top" style="object-fit: cover; height: 250px;" alt="...">
                                    <div class="card-body">
                                        <h5 class="card-title" th:text="${game.title}">游戏标题</h5>
                                        <p class="card-text" th:text="${game.description}">游戏描述</p>
                                    </div>
                                </div>
                            </a>
                        </div>
                    </div>
                </div>


                <hr class="my-4">
                <h5 class="mb-3">游戏推荐</h5>
                <div class="row">
                    <div th:if="${recommendations.isEmpty()}" class="col-12">
                        <p>暂无游戏推荐。</p>
                    </div>
                    <div th:each="rec : ${recommendations}" class="col-lg-6 mb-4">
                        <div class="card shadow h-100" th:with="game=${gameMap.get(rec.gameId)}">
                            <div class="card-body" th:if="${game != null}">
                                <div class="row no-gutters align-items-center">
                                    <div class="col-auto">
                                        <img th:src="${game.coverImageUrl != null ? game.coverImageUrl : 'https://via.placeholder.com/100x100?text=Game'}"
                                             class="rounded" style="width: 100px; height: 100px; object-fit: cover;" alt="Game Image">
                                    </div>
                                    <div class="col ml-3">
                                        <h5 class="card-title mb-1" th:text="${game.title}">游戏标题</h5>
                                        <p class="card-text small mb-2" th:text="${game.description}">游戏描述</p>
                                        <p class="card-text text-primary mb-0">
                                            <strong>推荐理由:</strong>
                                            <span th:text="${rec.reason}">推荐理由...</span>
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto">
                    <span>Copyright &copy; Your Website 2025</span>
                </div>
            </div>
        </footer>
    </div>
</div>
<script th:src="@{/admin_theme/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/admin_theme/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/admin_theme/vendor/jquery-easing/jquery.easing.min.js}"></script>
<script th:src="@{/admin_theme/js/sb-admin-2.min.js}"></script>
</body>
</html>

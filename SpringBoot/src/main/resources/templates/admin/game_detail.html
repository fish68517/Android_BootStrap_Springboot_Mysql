<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title th:text="'详情 - ' + ${game.title}">游戏详情</title>

    <link th:href="@{/admin_theme/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link th:href="@{/admin_theme/css/sb-admin-2.min.css}" rel="stylesheet">
</head>

<body id="page-top">
<div id="wrapper">

    <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
        <a class="sidebar-brand d-flex align-items-center justify-content-center" th:href="@{/admin/dashboard}">
            <div class="sidebar-brand-icon rotate-n-15"><i class="fas fa-laugh-wink"></i></div>
            <div class="sidebar-brand-text mx-3">管理员后台</div>
        </a>
        <hr class="sidebar-divider my-0">
        <li class="nav-item active">
            <a class="nav-link" th:href="@{/admin/dashboard}"><i class="fas fa-fw fa-tachometer-alt"></i><span>主页</span></a>
        </li>
        <hr class="sidebar-divider">
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/leaderboard}"><i class="fas fa-fw fa-list-ol"></i><span>排行榜</span></a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/favorites}"><i class="fas fa-fw fa-heart"></i><span>收藏</span></a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/likes}"><i class="fas fa-fw fa-thumbs-up"></i><span>点赞</span></a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/profile}"><i class="fas fa-fw fa-user"></i><span>个人中心</span></a>
        </li>
    </ul>
    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">

                <ul class="navbar-nav ml-auto">
                    <li class="nav-item dropdown no-arrow">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                           data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            <span class="mr-2 d-none d-lg-inline text-gray-600 small">管理员</span>
                            <img class="img-profile rounded-circle" th:src="@{/admin_theme/img/undraw_profile.svg}">
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="container-fluid">

                <a th:href="@{/admin/dashboard}" class="btn btn-outline-primary btn-sm mb-3">
                    <i class="fas fa-arrow-left fa-sm"></i> 返回主页
                </a>

                <h1 class="h3 mb-2 text-gray-800" th:text="${game.title}">游戏标题加载中...</h1>

                <div class="row">
                    <div class="col-lg-7">
                        <div class="card shadow mb-4">
                            <div class="card-body p-0">
                                <img th:src="${game.coverImageUrl != null ? game.coverImageUrl : 'https://via.placeholder.com/800x400?text=No+Cover+Image'}"
                                     class="img-fluid rounded" style="width: 100%;" alt="Cover Image">
                            </div>
                        </div>

                        <div class="card shadow mb-4">
                            <div class="card-header py-3">
                                <h6 class="m-0 font-weight-bold text-primary">更多图片</h6>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div th:if="${otherImages.isEmpty()}" class="col-12">
                                        <p>暂无更多图片。</p>
                                    </div>
                                    <div th:each="imgUrl : ${otherImages}" class="col-md-4 mb-3">
                                        <img th:src="${imgUrl}" class="img-fluid rounded" alt="More Game Images">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-5">
                        <div class="card shadow mb-4">
                            <div class="card-header py-3">
                                <h6 class="m-0 font-weight-bold text-primary">游戏信息</h6>
                            </div>
                            <div class="card-body">
                                <h6 class="font-weight-bold">游戏描述</h6>
                                <p th:text="${game.description}">游戏描述加载中...</p>
                                <hr>

                                <h6 class="font-weight-bold">发布者信息</h6>
                                <p><strong>发布者: </strong> <span th:text="${publisher.nickname}">...</span></p>
                                <p><strong>发布者账号: </strong> <span th:text="${publisher.username}">...</span></p>
                                <hr>

                                <h6 class="font-weight-bold">审核状态</h6>
                                <p>
                                    <strong>当前状态: </strong>
                                    <span th:text="${game.status}"
                                          th:classappend="${game.status == 'approved' ? 'text-success' : (game.status == 'rejected' ? 'text-danger' : 'text-warning')}"
                                          class="font-weight-bold">...</span>
                                </p>
                                <p><strong>提交时间: </strong> <span th:text="${game.submittedAt}">...</span></p>
                                <p th:if="${game.reviewedAt != null}">
                                    <strong>审核时间: </strong> <span th:text="${game.reviewedAt}">...</span>
                                </p>
                                <p th:if="${reviewer != null}">
                                    <strong>审核员: </strong> <span th:text="${reviewer.nickname}">...</span>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto">
                    <span>Copyright &copy; Your Website 2025</span>
                </div>
            </div>
        </footer>
    </div>
</div>
<script th:src="@{/admin_theme/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/admin_theme/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/admin_theme/vendor/jquery-easing/jquery.easing.min.js}"></script>
<script th:src="@{/admin_theme/js/sb-admin-2.min.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>注册</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #ade790;
        }
        .register-form {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            margin: auto;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="register-form text-center">
    <main class="form-register">
        <h1 class="h2 mb-3 fw-bold">外卖点餐系统</h1>
        <h2 class="h4 mb-4 fw-normal">创建账户</h2>
        <div id="success-message" class="alert alert-success" style="display: none;"></div>
        <div id="error-message" class="alert alert-danger" style="display: none;"></div>

        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="nickname" placeholder="Nickname">
            <label for="nickname">用户名</label>
        </div>
        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="password" placeholder="Password">
            <label for="password">密码</label>
        </div>
        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="phone" placeholder="Phone">
            <label for="phone">手机号</label>
        </div>
        
        <button class="w-100 btn btn-lg btn-primary" type="button" onclick="register()">注册</button>
        
        <p class="mt-3 text-center">
            已有账户? <a href="/login">立即登录</a>
        </p>
        <p class="mt-5 mb-3 text-muted text-center">&copy; 2024</p>
    </main>
</div>

<script>
    function register() {
        const nickname = document.getElementById('nickname').value;
        const password = document.getElementById('password').value;
        const phone = document.getElementById('phone').value;
        const successMessage = document.getElementById('success-message');
        const errorMessage = document.getElementById('error-message');

        const user = {
            nickname: nickname,
            password: password,
            phone: phone
        };

        fetch('/api/users', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(user)
        })
        .then(response => response.json())
        .then(data => {
            if (data === true) {
                successMessage.textContent = '注册成功！将跳转到登录页面...';
                successMessage.style.display = 'block';
                errorMessage.style.display = 'none';
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            } else {
                errorMessage.textContent = '注册失败，请检查您的输入。';
                errorMessage.style.display = 'block';
                successMessage.style.display = 'none';
            }
        })
        .catch((error) => {
            console.error('Error:', error);
            errorMessage.textContent = '注册时发生错误，请稍后重试。';
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        });
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

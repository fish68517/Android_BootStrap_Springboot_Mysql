<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏列表 - 游戏推荐平台</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .game-card {
            transition: transform 0.3s, box-shadow 0.3s;
            height: 100%;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }
        .game-card img {
            height: 200px;
            object-fit: cover;
        }
        .search-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 0;
        }
        .badge-status {
            font-size: 0.75rem;
        }
        .favorite-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
        }
        .favorite-icon.favorited {
            color: #dc3545;
        }
        .favorite-icon:not(.favorited) {
            color: #fff;
            text-shadow: 0 0 3px rgba(0,0,0,0.5);
        }
        .favorite-icon:hover {
            transform: scale(1.2);
        }
        .card {
            position: relative;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="bi bi-controller"></i> 游戏推荐平台
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/game/list}">游戏列表</a>
                    </li>
                    <li class="nav-item" th:if="${session.currentUser != null}">
                        <a class="nav-link" th:href="@{/favorite/list}">我的收藏</a>
                    </li>
                    <li class="nav-item" th:if="${session.currentUser != null}">
                        <a class="nav-link" th:href="@{/game/my-games}">我的游戏</a>
                    </li>
                    <li class="nav-item" th:if="${session.currentUser != null}">
                        <a class="nav-link" th:href="@{/user/profile}">个人中心</a>
                    </li>
                    <li class="nav-item" th:if="${session.currentUser == null}">
                        <a class="nav-link" th:href="@{/user/login}">登录</a>
                    </li>
                    <li class="nav-item" th:if="${session.currentUser != null}">
                        <a class="nav-link" th:href="@{/user/logout}">退出</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 搜索区域 -->
    <div class="search-section">
        <div class="container">
            <h2 class="text-center mb-4">发现精彩游戏</h2>
            <form th:action="@{/game/list}" method="get" class="row justify-content-center">
                <div class="col-md-6">
                    <div class="input-group input-group-lg">
                        <input type="text" 
                               class="form-control" 
                               name="query" 
                               th:value="${query}"
                               placeholder="搜索游戏名称...">
                        <button class="btn btn-light" type="submit">
                            <i class="bi bi-search"></i> 搜索
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- 游戏列表 -->
    <div class="container my-5">
        <!-- 推荐列表（仅登录用户可见） -->
        <div th:if="${session.currentUser != null and recommendations != null and !recommendations.isEmpty()}" class="mb-5">
            <h3 class="mb-4">
                <i class="bi bi-star-fill text-warning"></i> 为您推荐
            </h3>
            <div class="row row-cols-1 row-cols-md-2 g-4">
                <div class="col" th:each="rec : ${recommendations}">
                    <div class="card shadow-sm h-100" th:with="game=${recommendedGameMap != null ? recommendedGameMap.get(rec.gameId) : null}">
                        <div class="card-body" th:if="${game != null}">
                            <div class="row g-0 align-items-center">
                                <div class="col-auto">
                                    <img th:src="${game.coverImageUrl != null and !game.coverImageUrl.isEmpty() ? game.coverImageUrl : 'https://via.placeholder.com/100x100?text=Game'}"
                                         class="rounded" 
                                         style="width: 100px; height: 100px; object-fit: cover;" 
                                         th:alt="${game.title}">
                                </div>
                                <div class="col ms-3">
                                    <h5 class="card-title mb-1" th:text="${game.title}">游戏标题</h5>
                                    <p class="card-text small text-muted mb-2" 
                                       th:text="${#strings.length(game.description) > 80 ? #strings.substring(game.description, 0, 80) + '...' : game.description}">
                                        游戏描述
                                    </p>
                                    <p class="card-text text-primary mb-2">
                                        <i class="bi bi-lightbulb"></i>
                                        <strong>推荐理由：</strong>
                                        <span th:text="${rec.reason}">推荐理由...</span>
                                    </p>
                                    <a th:href="@{/game/detail/{id}(id=${game.gameId})}" class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-eye"></i> 查看详情
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <hr class="my-5">
        </div>
        
        <!-- 搜索结果提示 -->
        <div th:if="${query != null and !query.isEmpty()}" class="alert alert-info">
            <i class="bi bi-info-circle"></i> 搜索 "<span th:text="${query}"></span>" 的结果，共找到 <span th:text="${#lists.size(games)}"></span> 个游戏
        </div>

        <!-- 游戏卡片 -->
        <div class="row row-cols-1 row-cols-md-3 g-4" th:if="${games != null and !games.isEmpty()}">
            <div class="col" th:each="game : ${games}">
                <div class="card game-card">
                    <!-- 收藏图标（仅登录用户可见） -->
                    <i th:if="${session.currentUser != null}" 
                       class="bi favorite-icon"
                       th:classappend="${favoriteStatus != null and favoriteStatus.get(game.gameId) ? 'bi-heart-fill favorited' : 'bi-heart'}"
                       th:data-game-id="${game.gameId}"
                       th:data-favorited="${favoriteStatus != null and favoriteStatus.get(game.gameId)}"
                       onclick="toggleFavoriteInList(this, event)"></i>
                    
                    <img th:src="${game.coverImageUrl != null and !game.coverImageUrl.isEmpty() ? game.coverImageUrl : 'https://via.placeholder.com/400x200?text=No+Image'}" 
                         class="card-img-top" 
                         th:alt="${game.title}">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${game.title}">游戏标题</h5>
                        <p class="card-text text-muted" 
                           th:text="${#strings.length(game.description) > 100 ? #strings.substring(game.description, 0, 100) + '...' : game.description}">
                            游戏描述
                        </p>
                        <div class="d-flex justify-content-between align-items-center">
                            <a th:href="@{/game/detail/{id}(id=${game.gameId})}" class="btn btn-primary btn-sm">
                                <i class="bi bi-eye"></i> 查看详情
                            </a>
                            <small class="text-muted" th:text="${#temporals.format(game.submittedAt, 'yyyy-MM-dd')}">
                                2024-01-01
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 空状态 -->
        <div th:if="${games == null or games.isEmpty()}" class="text-center py-5">
            <i class="bi bi-inbox" style="font-size: 4rem; color: #ccc;"></i>
            <h4 class="mt-3 text-muted">暂无游戏</h4>
            <p class="text-muted">
                <span th:if="${query != null and !query.isEmpty()}">未找到匹配的游戏，请尝试其他关键词</span>
                <span th:if="${query == null or query.isEmpty()}">还没有已审核通过的游戏</span>
            </p>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 收藏/取消收藏功能（列表页）
        function toggleFavoriteInList(icon, event) {
            event.stopPropagation(); // 防止触发卡片点击事件
            
            const gameId = $(icon).data('game-id');
            const isFavorited = $(icon).data('favorited');
            const url = isFavorited ? '/favorite/remove' : '/favorite/add';
            
            $.ajax({
                url: url,
                type: 'POST',
                data: { gameId: gameId },
                success: function(response) {
                    if (response.success) {
                        // 切换图标状态
                        if (isFavorited) {
                            $(icon).removeClass('bi-heart-fill favorited').addClass('bi-heart');
                            $(icon).data('favorited', false);
                        } else {
                            $(icon).removeClass('bi-heart').addClass('bi-heart-fill favorited');
                            $(icon).data('favorited', true);
                        }
                    } else {
                        alert(response.message || '操作失败');
                    }
                },
                error: function() {
                    alert('操作失败，请稍后重试');
                }
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>订单管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>订单管理</h3>
    </div>

    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>订单号</th>
            <th>总价</th>
            <th>订单状态</th>
            <th>创建时间</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody id="order-table-body">
        <!-- Order data will be loaded here -->
        </tbody>
    </table>
</div>

<!-- Order Details Modal -->
<div class="modal fade" id="orderDetailsModal" tabindex="-1" aria-labelledby="orderDetailsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="orderDetailsModalLabel">订单详情</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <h6>订单号: <span id="modalOrderNo"></span></h6>
                <div id="modalOrderDetails" class="mt-3">
                    <!-- Details will be populated here -->
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const detailsModal = new bootstrap.Modal(document.getElementById('orderDetailsModal'));

    document.addEventListener('DOMContentLoaded', loadOrders);

    function getStatusText(status) {
        switch (status) {
            case 0: return '<span class="badge bg-warning text-dark">待支付</span>';
            case 1: return '<span class="badge bg-success">已支付</span>';
            case 2: return '<span class="badge bg-info">制作中</span>';
            case 3: return '<span class="badge bg-primary">已完成</span>';
            case 4: return '<span class="badge bg-secondary">已取消</span>';
            default: return '<span class="badge bg-light text-dark">未知状态</span>';
        }
    }

    function loadOrders() {
        fetch('/api/orders')
            .then(response => response.json())
            .then(data => {
                const tableBody = document.getElementById('order-table-body');
                tableBody.innerHTML = '';
                data.sort((a, b) => b.orderId - a.orderId); // Show latest orders first
                data.forEach(order => {
                    const row = `
                        <tr>
                            <td>${order.orderNo}</td>
                            <td>¥${order.totalAmount.toFixed(2)}</td>
                            <td>${getStatusText(order.status)}</td>
                            <td>${new Date(order.createdAt).toLocaleString()}</td>
                            <td>
                                <button class="btn btn-sm btn-info" onclick="viewOrderDetails(${order.orderId})">
                                    <i class="bi bi-eye"></i> 查看
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="deleteOrder(${order.orderId})">
                                    <i class="bi bi-trash"></i> 删除
                                </button>
                            </td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            })
            .catch(error => console.error('Error loading orders:', error));
    }

    async function viewOrderDetails(orderId) {
        try {
            const response = await fetch(`/api/orders/${orderId}`);
            if (!response.ok) throw new Error('Failed to fetch order details.');
            
            const order = await response.json();
            document.getElementById('modalOrderNo').textContent = order.orderNo;
            const detailsContainer = document.getElementById('modalOrderDetails');
            detailsContainer.innerHTML = '<p>正在加载菜品信息...</p>';

            const cartItems = order.cartItems.split(';').filter(item => item);
            const dishPromises = cartItems.map(item => {
                const [dishId] = item.split(':');
                return fetch(`/api/dishes/${dishId}`).then(res => res.json());
            });

            const dishes = await Promise.all(dishPromises);
            const dishesMap = new Map(dishes.map(d => [d.dishId, d]));

            let detailsHtml = '<ul class="list-group">';
            cartItems.forEach(item => {
                const [dishId, quantity, options] = item.split(/:(.*)/s).slice(1)[0].split(/:(.*)/s);
                const dish = dishesMap.get(parseInt(dishId));
                const dishName = dish ? dish.dishName : `菜品ID: ${dishId}`;
                
                detailsHtml += `
                    <li class="list-group-item">
                        <strong>${dishName}</strong> x ${quantity}
                        ${options ? `<br><small class="text-muted">${options.replace(/[{}]/g, '').replace(/,/g, ', ')}</small>` : ''}
                    </li>
                `;
            });
            detailsHtml += '</ul>';
            if(order.remark) {
                 detailsHtml += `<div class="mt-3"><strong>备注:</strong> ${order.remark}</div>`;
            }

            detailsContainer.innerHTML = detailsHtml;
            detailsModal.show();
        } catch (error) {
            console.error('Error viewing order details:', error);
            alert('查看订单详情失败');
        }
    }

    function deleteOrder(orderId) {
        if (!confirm('您确定要删除这个订单吗？此操作不可撤销。')) return;

        fetch(`/api/orders/${orderId}`, { method: 'DELETE' })
            .then(response => {
                if (response.ok) {
                    loadOrders();
                } else {
                    response.text().then(text => alert(text || '删除失败'));
                }
            })
            .catch(error => {
                console.error('Error deleting order:', error);
                alert('删除订单时发生错误');
            });
    }
</script>
</body>
</html>

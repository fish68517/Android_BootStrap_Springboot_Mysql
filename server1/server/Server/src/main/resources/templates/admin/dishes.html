<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>菜品管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>菜品管理</h3>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#dishModal" onclick="openAddModal()">
            <i class="bi bi-plus-circle"></i> 添加菜品
        </button>
    </div>

    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>ID</th>
            <th>菜品名称</th>
            <th>价格</th>
            <th>描述</th>
            <th>创建时间</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody id="dish-table-body">
        <!-- Dish data will be loaded here -->
        </tbody>
    </table>
</div>

<!-- Dish Modal for Add/Edit -->
<div class="modal fade" id="dishModal" tabindex="-1" aria-labelledby="dishModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="dishModalLabel">添加菜品</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="dishForm">
                    <input type="hidden" id="dishId">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="dishName" class="form-label">菜品名称</label>
                            <input type="text" class="form-control" id="dishName" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="price" class="form-label">价格</label>
                            <input type="number" class="form-control" id="price" step="0.01" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">描述</label>
                        <textarea class="form-control" id="description" rows="3"></textarea>
                    </div>
                     <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="categoryId" class="form-label">分类ID</label>
                            <input type="number" class="form-control" id="categoryId" required>
                        </div>
                        <div class="col-md-6 mb-3">
                             <label for="storeId" class="form-label">店铺ID</label>
                            <input type="number" class="form-control" id="storeId" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="dishOptions" class="form-label">菜品规格 (JSON格式)</label>
                        <textarea class="form-control" id="dishOptions" rows="4" placeholder='例如：&#10;{"容量": ["小份", "中份"], "甜度": ["无糖", "标准"]}'></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="status" class="form-label">状态</label>
                        <select id="status" class="form-select">
                            <option value="1">上架</option>
                            <option value="0">下架</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                <button type="button" class="btn btn-primary" onclick="saveDish()">保存</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const dishModal = new bootstrap.Modal(document.getElementById('dishModal'));
    const dishForm = document.getElementById('dishForm');

    document.addEventListener('DOMContentLoaded', loadDishes);

    function loadDishes() {
        fetch('/api/dishes')
            .then(response => response.json())
            .then(data => {
                const tableBody = document.getElementById('dish-table-body');
                tableBody.innerHTML = '';
                data.sort((a,b) => b.dishId - a.dishId).forEach(dish => {
                    const row = `
                        <tr>
                            <td>${dish.dishId}</td>
                            <td>${dish.dishName}</td>
                            <td>¥${dish.price.toFixed(2)}</td>
                            <td>${dish.description}</td>
                            <td>${new Date(dish.createdAt).toLocaleString()}</td>
                            <td>
                                <button class="btn btn-sm btn-warning" onclick="openEditModal(${dish.dishId})">
                                    <i class="bi bi-pencil-square"></i> 编辑
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="deleteDish(${dish.dishId})">
                                    <i class="bi bi-trash"></i> 删除
                                </button>
                            </td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            })
            .catch(error => console.error('Error loading dishes:', error));
    }

    function openAddModal() {
        dishForm.reset();
        document.getElementById('dishId').value = '';
        document.getElementById('dishModalLabel').textContent = '添加菜品';
    }

    function openEditModal(id) {
        fetch(`/api/dishes/${id}`)
            .then(response => response.json())
            .then(dish => {
                document.getElementById('dishId').value = dish.dishId;
                document.getElementById('dishName').value = dish.dishName;
                document.getElementById('price').value = dish.price;
                document.getElementById('description').value = dish.description;
                document.getElementById('categoryId').value = dish.categoryId;
                document.getElementById('storeId').value = dish.storeId;
                document.getElementById('dishOptions').value = dish.dishOptions ? JSON.stringify(JSON.parse(dish.dishOptions), null, 4) : '';
                document.getElementById('status').value = dish.status;
                
                document.getElementById('dishModalLabel').textContent = '编辑菜品';
                dishModal.show();
            })
            .catch(error => console.error('Error fetching dish:', error));
    }

    function saveDish() {
        const dishId = document.getElementById('dishId').value;
        let dishOptionsValue = document.getElementById('dishOptions').value;
        try {
            if(dishOptionsValue){
                 JSON.parse(dishOptionsValue);
            }
        } catch(e) {
            alert('菜品规格必须是有效的JSON格式！');
            return;
        }

        const dishData = {
            dishId: dishId || null,
            dishName: document.getElementById('dishName').value,
            price: parseFloat(document.getElementById('price').value),
            description: document.getElementById('description').value,
            categoryId: parseInt(document.getElementById('categoryId').value),
            storeId: parseInt(document.getElementById('storeId').value),
            dishOptions: dishOptionsValue,
            status: parseInt(document.getElementById('status').value)
        };

        const isUpdating = !!dishId;
        const url = isUpdating ? `/api/dishes` : '/api/dishes';
        const method = isUpdating ? 'PUT' : 'POST';

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dishData)
        })
        .then(response => {
            if (response.ok) {
                dishModal.hide();
                loadDishes();
            } else {
                 response.text().then(text => alert(text || '操作失败'));
            }
        })
        .catch(error => console.error('Error saving dish:', error));
    }

    function deleteDish(id) {
        if (!confirm('您确定要删除这个菜品吗？')) return;
        
        fetch(`/api/dishes/${id}`, { method: 'DELETE' })
            .then(response => {
                if (response.ok) {
                    loadDishes();
                } else {
                    response.text().then(text => alert(text));
                }
            })
            .catch(error => {
                 console.error('Error deleting dish:', error);
                 alert('删除时发生错误');
            });
    }
</script>
</body>
</html>

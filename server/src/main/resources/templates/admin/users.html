<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>用户管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>用户管理</h3>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal" onclick="openAddModal()">
            <i class="bi bi-plus-circle"></i> 添加用户
        </button>
    </div>

    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>ID</th>
            <th>昵称</th>
            <th>手机号</th>
            <th>性别</th>
            <th>创建时间</th>
            <th>更新时间</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody id="user-table-body">
        <!-- User data will be loaded here via JavaScript -->
        </tbody>
    </table>
</div>

<!-- User Modal for Add/Edit -->
<div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="userModalLabel">添加用户</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="userForm">
                    <input type="hidden" id="userId">
                    <div class="mb-3">
                        <label for="nickname" class="form-label">昵称</label>
                        <input type="text" class="form-control" id="nickname" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">密码</label>
                        <input type="password" class="form-control" id="password">
                        <small class="form-text text-muted">如果不需要修改密码，请留空。</small>
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">手机号</label>
                        <input type="text" class="form-control" id="phone" required>
                    </div>
                    <div class="mb-3">
                        <label for="gener" class="form-label">性别</label>
                        <select class="form-select" id="gener">
                            <option value="男">男</option>
                            <option value="女">女</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                <button type="button" class="btn btn-primary" onclick="saveUser()">保存</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const userModal = new bootstrap.Modal(document.getElementById('userModal'));
    const userForm = document.getElementById('userForm');

    // Load users when page is ready
    document.addEventListener('DOMContentLoaded', function () {
        loadUsers();
    });

    // Fetch and display all users
    function loadUsers() {
        fetch('/api/users')
            .then(response => response.json())
            .then(data => {
                const tableBody = document.getElementById('user-table-body');
                tableBody.innerHTML = ''; // Clear existing data
                data.forEach(user => {
                    const row = `
                        <tr>
                            <td>${user.userId}</td>
                            <td>${user.nickname}</td>
                            <td>${user.phone}</td>
                            <td>${user.gener || '男'}</td>
                            <td>${new Date(user.createdAt).toLocaleString()}</td>
                            <td>${new Date(user.updatedAt).toLocaleString()}</td>
                            <td>
                                <button class="btn btn-sm btn-warning" onclick="openEditModal(${user.userId})">
                                    <i class="bi bi-pencil-square"></i> 编辑
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="deleteUser(${user.userId})">
                                    <i class="bi bi-trash"></i> 删除
                                </button>
                            </td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            })
            .catch(error => console.error('Error loading users:', error));
    }

    // Open modal for adding a new user
    function openAddModal() {
        userForm.reset();
        document.getElementById('userId').value = '';
        document.getElementById('password').required = true;
        document.getElementById('userModalLabel').textContent = '添加用户';
    }

    // Open modal for editing an existing user
    function openEditModal(id) {
        fetch(`/api/users/${id}`)
            .then(response => response.json())
            .then(user => {
                document.getElementById('userId').value = user.userId;
                document.getElementById('nickname').value = user.nickname;
                document.getElementById('phone').value = user.phone;
                document.getElementById('gener').value = user.gener || '男';
                document.getElementById('password').value = ''; // Clear password field
                document.getElementById('password').required = false;

                document.getElementById('userModalLabel').textContent = '编辑用户';
                userModal.show();
            });
    }

    // Save or update a user
    function saveUser() {
        const userId = document.getElementById('userId').value;
        const password = document.getElementById('password').value;
        const userData = {
            userId: userId || null,
            nickname: document.getElementById('nickname').value,
            phone: document.getElementById('phone').value,
            gener: document.getElementById('gener').value,
        };

        if(password){
            userData.password = password;
        }

        const isUpdating = !!userId;
        const url = isUpdating ? `/api/users` : '/api/users';
        const method = isUpdating ? 'PUT' : 'POST';

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(userData)
        })
        .then(response => {
            if (response.ok) {
                userModal.hide();
                loadUsers(); // Reload the list
            } else {
                alert('操作失败');
            }
        })
        .catch(error => console.error('Error saving user:', error));
    }

    // Delete a user
    function deleteUser(id) {
        if (confirm('您确定要删除这个用户吗?')) {
            fetch(`/api/users/${id}`, {
                method: 'DELETE'
            })
            .then(response => {
                if (response.ok) {
                    loadUsers(); // Reload the list
                } else {
                    response.text().then(text => {
                        alert(text || '删除失败');
                    });
                }
            })
            .catch(error => {
                console.error('Error deleting user:', error)
                alert('删除时发生错误');
            });
        }
    }
</script>
</body>
</html>

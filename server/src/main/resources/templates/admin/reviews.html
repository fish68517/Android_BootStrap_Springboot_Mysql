<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>评价管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .rating-stars .bi-star-fill { color: #ffc107; }
        .comment-cell { max-width: 400px; }
    </style>
</head>
<body>
<div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>评价管理</h3>
    </div>

    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>订单ID</th>
            <th>评分</th>
            <th>评价内容</th>
            <th>创建时间</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody id="review-table-body">
        <!-- Review data will be loaded here -->
        </tbody>
    </table>
</div>

<!-- Edit Review Modal -->
<div class="modal fade" id="reviewModal" tabindex="-1" aria-labelledby="reviewModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="reviewModalLabel">编辑评价</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="reviewForm">
                    <input type="hidden" id="reviewId">
                     <div class="mb-3">
                        <label for="orderId" class="form-label">订单ID</label>
                        <input type="text" class="form-control" id="orderId" disabled>
                    </div>
                    <div class="mb-3">
                        <label for="rating" class="form-label">评分 (1-5)</label>
                        <input type="number" class="form-control" id="rating" min="1" max="5" required>
                    </div>
                    <div class="mb-3">
                        <label for="comment" class="form-label">评价内容</label>
                        <textarea class="form-control" id="comment" rows="4" required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                <button type="button" class="btn btn-primary" onclick="saveReview()">保存</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const reviewModal = new bootstrap.Modal(document.getElementById('reviewModal'));
    const reviewForm = document.getElementById('reviewForm');

    document.addEventListener('DOMContentLoaded', loadReviews);

    function renderStars(rating) {
        let stars = '';
        for (let i = 1; i <= 5; i++) {
            stars += `<i class="bi ${i <= rating ? 'bi-star-fill' : 'bi-star'}"></i>`;
        }
        return `<span class="rating-stars">${stars}</span>`;
    }

    function loadReviews() {
        fetch('/api/reviews')
            .then(response => response.json())
            .then(data => {
                const tableBody = document.getElementById('review-table-body');
                tableBody.innerHTML = '';
                 data.sort((a,b) => b.reviewId - a.reviewId).forEach(review => {
                    const row = `
                        <tr>
                            <td>${review.orderId}</td>
                            <td>${renderStars(review.rating)}</td>
                            <td class="comment-cell text-truncate">${review.comment}</td>
                            <td>${new Date(review.createdAt).toLocaleString()}</td>
                            <td>
                                <button class="btn btn-sm btn-warning" onclick="openEditModal(${review.reviewId})">
                                    <i class="bi bi-pencil-square"></i> 编辑
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="deleteReview(${review.reviewId})">
                                    <i class="bi bi-trash"></i> 删除
                                </button>
                            </td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            })
            .catch(error => console.error('Error loading reviews:', error));
    }

    function openEditModal(id) {
        fetch(`/api/reviews/${id}`)
            .then(response => response.json())
            .then(review => {
                document.getElementById('reviewId').value = review.reviewId;
                document.getElementById('orderId').value = review.orderId;
                document.getElementById('rating').value = review.rating;
                document.getElementById('comment').value = review.comment;
                reviewModal.show();
            })
            .catch(error => console.error('Error fetching review:', error));
    }

    function saveReview() {
        const reviewId = document.getElementById('reviewId').value;
        const reviewData = {
            reviewId: parseInt(reviewId),
            rating: parseInt(document.getElementById('rating').value),
            comment: document.getElementById('comment').value
        };

        fetch('/api/reviews', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(reviewData)
        })
        .then(response => {
            if (response.ok) {
                reviewModal.hide();
                loadReviews();
            } else {
                 response.text().then(text => alert(text || '操作失败'));
            }
        })
        .catch(error => console.error('Error saving review:', error));
    }

    function deleteReview(id) {
        if (!confirm('您确定要删除这条评价吗？')) return;
        
        fetch(`/api/reviews/${id}`, { method: 'DELETE' })
            .then(response => {
                if (response.ok) {
                    loadReviews();
                } else {
                    alert('删除失败');
                }
            })
            .catch(error => {
                console.error('Error deleting review:', error);
                alert('删除时发生错误');
            });
    }
</script>
</body>
</html>
